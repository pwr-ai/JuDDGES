repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        name: No commits to master
      - id: end-of-file-fixer
        name: End-of-file fixer
      - name: mixed-line-ending
        id: mixed-line-ending
        args: [--fix, lf]
      - id: trailing-whitespace
        name: Remove trailing whitespaces
      - id: check-toml
        name: Check toml
      - id: check-yaml
        name: Check yaml
        args: [--allow-multiple-documents]
        exclude: ^mkdocs\.yml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix, --exit-non-zero-on-fix, juddges, scripts, tests]
        types_or: [ python, pyi ]
      - id: ruff-format
        name: Ruff Formatter
        args: [juddges, scripts, tests]
        types_or: [ python, pyi ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks
        language_version: 1.23.6 # due to: https://github.com/gitleaks/gitleaks/issues/1751

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        name: Markdown Lint
        files: ^docs/.*\.md$
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.6.0
    hooks:
      - id: cspell
        name: Spell Checker
        args: ["--config", "cspell.json"]
        files: ^(docs/.*\.md|README\.md)$

  - repo: local
    hooks:
      - id: test-doc-code-examples
        name: Test Documentation Code Examples
        entry: python scripts/docs/test_code_examples.py
        language: python
        additional_dependencies:
          - pyyaml
          - loguru
          - rich
        files: ^docs/.*\.md$
        pass_filenames: true
        always_run: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        name: Markdown Lint
        files: ^docs/.*\.md$
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.6.0
    hooks:
      - id: cspell
        name: Spell Checker
        args: ["--config", "cspell.json"]
        files: ^(docs/.*\.md|README\.md)$

  - repo: local
    hooks:
      - id: test-doc-code-examples
        name: Test Documentation Code Examples
        entry: python scripts/docs/test_code_examples.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true
        always_run: false

exclude: 'data/|dvc.lock'
