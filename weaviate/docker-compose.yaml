name: legal_ai

services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8084'
      - --scheme
      - http
    image: cr.weaviate.io/semitechnologies/weaviate:1.30.2
    depends_on:
      - embedding-server
    ports:
      - 8084:8084
      - 8085:50051
      - 6060:6060  # Debug/profiling endpoint for migration status
    volumes:
      - legal_ai_weaviate_prod:/var/lib/weaviate
      - /mnt/readynas/datasets/legal-ai-weaviate/native-backups:/var/lib/weaviate-backups
    env_file: .env
    restart: always
    networks:
      - default
      - nginx-router_proxy-tier
    environment:
      - LETSENCRYPT_HOST=legal-ai-weaviate.augustyniak.ai
      - VIRTUAL_HOST=legal-ai-weaviate.augustyniak.ai
      - LETSENCRYPT_EMAIL=lukasz@augustyniak.ai
      - VIRTUAL_PORT=8084
      # Performance tuning
      - QUERY_MAXIMUM_RESULTS=10000
      - QUERY_DEFAULTS_LIMIT=25
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - PERSISTENCE_LSM_ACCESS_STRATEGY=mmap
      - DISK_USE_READONLY_PERCENTAGE=95
      - ASYNC_INDEXING=true
      - REINDEX_VECTOR_DIMENSIONS_AT_STARTUP=false
      # Connection and timeout settings
      - GOMEMLIMIT=100GiB
      - GOGC=100
      # Batch processing optimization
      - BATCH_DELETE_TIMEOUT=10m
      - BATCH_UPDATE_TIMEOUT=10m
      # BlockMax WAND: not applicable - collection uses older LSM format (not mapcollection)
      # To enable BlockMax, recreate collection in v1.30+ and re-ingest data
      # - REINDEX_MAP_TO_BLOCKMAX_AT_STARTUP=juddges-vm
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '32'
          memory: '128G'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Embedding server: Qwen3-Embedding-0.6B via HuggingFace TEI
  # Vectors are pre-computed during ingestion (Weaviate vectorizer=none)
  # This service is used by the stream_ingester for embedding generation
  embedding-server:
    image: ghcr.io/huggingface/text-embeddings-inference:1.7.2
    command: --model-id Qwen/Qwen3-Embedding-0.6B --max-client-batch-size 256
    ports:
      - "8082:80"
    volumes:
      - embedding_model_cache:/data
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '8'
          memory: '16G'
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for distributed extraction queue
  extraction-redis:
    image: redis:7-alpine
    container_name: legal_ai_extraction_redis
    command: redis-server --appendonly no --save "" --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6381:6379"  # Port 6381 to avoid conflicts with other Redis instances
    volumes:
      - legal_ai_extraction_redis_data:/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '4G'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for extraction storage (separate from cache)
  extraction-postgres:
    image: postgres:16-alpine
    container_name: legal_ai_extraction_postgres
    environment:
      POSTGRES_USER: ${EXTRACTION_POSTGRES_USER:-extraction_user}
      POSTGRES_PASSWORD: ${EXTRACTION_POSTGRES_PASSWORD:-extraction_pass}
      POSTGRES_DB: ${EXTRACTION_POSTGRES_DB:-legal_extraction}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"  # Port 5434 (5432, 5433, 5555 already in use)
    volumes:
      - legal_ai_extraction_postgres_data:/var/lib/postgresql/data
      - ./init_extraction_db.sql:/docker-entrypoint-initdb.d/init_extraction_db.sql:ro
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: '8G'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  legal_ai_weaviate_prod:
    external: true
  legal_ai_extraction_redis_data:
  legal_ai_extraction_postgres_data:
  embedding_model_cache:

networks:
  nginx-router_proxy-tier:
    external: true
