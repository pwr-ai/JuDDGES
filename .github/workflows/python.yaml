name: python-lint-and-test
on: [ push ]

jobs:
  python-check:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ 3.11 ]
        os:
          - ubuntu-latest
          - macos-latest # at the moment bitsandbytes installation fails on macOS
#          - windows-latest # utf-8 bugs on windows (https://github.com/pre-commit/pre-commit/issues/835)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            make install_macos
          else
            make install_cpu
          fi

      - name: Lint
        env:
          # no-commit-to-branch only guards local commits; docs hooks run in docs-quality-checks.yaml
          SKIP: no-commit-to-branch,markdownlint-cli2,cspell,test-doc-code-examples
        run: make check

  python-test:
    needs:
      - python-check
    strategy:
      fail-fast: false
      matrix:
        python-version: [ 3.11 ]
        os:
          - ubuntu-latest
          - macos-latest # at the moment bitsandbytes installation fails on macOS
#          - windows-latest # utf-8 bugs on windows (https://github.com/pre-commit/pre-commit/issues/835)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            make install_macos
          else
            make install_cpu
          fi

      - name: Test
        env:
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
        run: make test
