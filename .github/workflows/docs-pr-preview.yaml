name: Documentation PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'juddges/**/*.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    name: Build Documentation Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-preview-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-preview-
            ${{ runner.os }}-pip-

      - name: Cache MkDocs build
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-mkdocs-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-pr-${{ github.event.pull_request.number }}-
            ${{ runner.os }}-mkdocs-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocstrings[python] pymdown-extensions
          pip install -e .

      - name: Build documentation
        run: |
          mkdocs build --strict --verbose
          echo "Documentation built successfully"

      - name: Generate documentation summary
        id: doc-summary
        run: |
          # Count markdown files changed
          CHANGED_MD_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -c '\.md$' || echo 0)

          # Count new files
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD | grep -c '\.md$' || echo 0)

          # Count modified files
          MODIFIED_FILES=$(git diff --name-only --diff-filter=M origin/${{ github.base_ref }}...HEAD | grep -c '\.md$' || echo 0)

          # Count deleted files
          DELETED_FILES=$(git diff --name-only --diff-filter=D origin/${{ github.base_ref }}...HEAD | grep -c '\.md$' || echo 0)

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.md$' || echo "")

          # Create summary
          echo "## Documentation Changes Summary" > summary.md
          echo "" >> summary.md
          echo "- **Total files changed**: $CHANGED_MD_FILES" >> summary.md
          echo "- **New files**: $NEW_FILES" >> summary.md
          echo "- **Modified files**: $MODIFIED_FILES" >> summary.md
          echo "- **Deleted files**: $DELETED_FILES" >> summary.md
          echo "" >> summary.md

          if [ ! -z "$CHANGED_FILES" ]; then
            echo "### Changed Files:" >> summary.md
            echo "\`\`\`" >> summary.md
            echo "$CHANGED_FILES" >> summary.md
            echo "\`\`\`" >> summary.md
          fi

          echo "" >> summary.md
          echo "### Build Status: :white_check_mark: Success" >> summary.md
          echo "" >> summary.md
          echo "> Note: This is a preview build. The documentation will be deployed when this PR is merged to main/master." >> summary.md

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: summary.md
          comment_tag: docs-preview
          mode: recreate

  preview-validation:
    name: Validate Preview Build
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocstrings[python] pymdown-extensions
          pip install -e .

      - name: Check for documentation warnings
        run: |
          # Build and capture output
          mkdocs build --strict 2>&1 | tee build.log

          # Check for warnings
          if grep -i "warning" build.log; then
            echo "::warning::Documentation build contains warnings"
          fi

      - name: Size check
        run: |
          SITE_SIZE=$(du -sh site/ | cut -f1)
          echo "Documentation site size: $SITE_SIZE"

          # Optional: Add size limit check
          # SITE_SIZE_MB=$(du -sm site/ | cut -f1)
          # if [ $SITE_SIZE_MB -gt 100 ]; then
          #   echo "::warning::Documentation site is larger than 100MB"
          # fi
