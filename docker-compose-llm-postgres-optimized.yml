version: '3.8'

# Optimized PostgreSQL for 45 workers
# Key improvements:
# - max_connections: 300 (from 150)
# - shared_buffers: 512MB (from 256MB)
# - effective_cache_size: 2GB (from 1GB)
# - work_mem: 8MB (added for parallel queries)
# - Resource limits: 4G memory, 4 CPUs

services:
  llm-postgres:
    image: postgres:15.2
    container_name: llm-postgres
    command:
      - postgres
      - -c
      - max_connections=300  # Increased for 45 workers
      - -c
      - shared_buffers=512MB  # Double previous value
      - -c
      - effective_cache_size=2GB  # Double previous value
      - -c
      - maintenance_work_mem=128MB  # Double previous value
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB  # Added for parallel queries
      - -c
      - max_parallel_workers_per_gather=4  # Enable parallel queries
      - -c
      - max_worker_processes=8  # Background worker processes
      - -c
      - max_parallel_workers=8  # Total parallel workers
      - -c
      - idle_in_transaction_session_timeout=300000  # 5 min timeout for idle transactions
      - -c
      - statement_timeout=600000  # 10 min query timeout
    env_file:
      - .env
    healthcheck:
      interval: 10s
      retries: 60
      start_period: 2s
      test: pg_isready -q -d ${POSTGRES_DB} -U ${POSTGRES_USER} | grep "accepting connections" || exit 1
      timeout: 2s
    ports:
      - 5555:5432
    restart: always
    networks:
      - langchain-network
    deploy:
      resources:
        limits:
          memory: 4G  # Increased from 2G
          cpus: '4'   # Increased from 2
        reservations:
          memory: 1G  # Increased from 512M
          cpus: '1'   # Increased from 0.5
    volumes:
      - llm-postgres-data:/var/lib/postgresql/data

networks:
  langchain-network:
    driver: bridge

volumes:
  llm-postgres-data:
